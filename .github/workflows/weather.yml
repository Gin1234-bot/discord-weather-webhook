name: Discord Weather Webhook 24/7

on:
  schedule:
    # 00:00 UTC = 07:00 sáng giờ Việt Nam (Gửi bản tin sáng)
    - cron: "0 0 * * *"
    # Phút thứ 17 mỗi giờ: quét kiểm tra biến động thời tiết bất thường
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Chọn chế độ (morning hoặc check)"
        required: true
        default: "check"
        type: choice
        options:
          - morning
          - check

permissions:
  contents: write

concurrency: weather_webhook

jobs:
  run-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài đặt thư viện requests
        run: pip install requests

      - name: Xác định chế độ chạy
        run: |
          if [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            echo "MODE=morning" >> $GITHUB_ENV
          else
            echo "MODE=${{ github.event.inputs.mode || 'check' }}" >> $GITHUB_ENV
          fi

      - name: Chạy script cập nhật thời tiết
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python weather.py $MODE

      - name: Lưu trạng thái state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "chore: Cập nhật state thời tiết tự động" && git push)
