name: weather

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "15,45 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Select mode"
        required: true
        default: "check"
        type: choice
        options:
          - morning
          - check

permissions:
  contents: write

concurrency:
  group: weather_webhook

jobs:
  run-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Determine mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            echo "MODE=morning" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ inputs.mode }}" >> $GITHUB_ENV
          else
            echo "MODE=check" >> $GITHUB_ENV
          fi

      - name: Run weather script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python weather.py $MODE

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "chore: auto update weather state" && git push)
